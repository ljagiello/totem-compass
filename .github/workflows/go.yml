name: Go

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**.h"
      - "**/testdata/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "**.go"
      - "**.h"
      - "**/testdata/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux uses BlueZ over D-Bus, macOS uses CoreBluetooth through cgo.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Windows has its own Bluetooth backend (client/ble_windows.go); make
      # sure it still builds.
      - name: Build and vet for Windows
        if: runner.os == 'Linux'
        env:
          GOOS: windows
        run: go vet ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    # Every input that ever failed stays in testdata/fuzz and runs with the
    # tests above; this job searches for new ones for a short while.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./protocol, target: FuzzParse }
          - { package: ./protocol, target: FuzzParseMAC }
          - { package: ./protocol, target: FuzzParseRGB }
          - { package: ./protocol, target: FuzzEncoders }
          - { package: ./client, target: FuzzReceive }
          - { package: ./client/clienttest, target: FuzzWrite }
          - { package: ./cmd/totemctl, target: FuzzParseRawFrame }
          - { package: ./cmd/totemctl, target: FuzzConsoleLine }
          - { package: ./mesh, target: FuzzParse }
          - { package: ./mesh, target: FuzzHalf }
          - { package: ./emulator, target: FuzzNode }
          - { package: ./emulator, target: FuzzParseCommand }
          - { package: ./emulator, target: FuzzLineReader }
          - { package: ./cmd/totememu/ring, target: FuzzRing }
          - { package: ./store, target: FuzzScan }
          - { package: ./store, target: FuzzStateDecode }
          - { package: ./emulator, target: FuzzOTAServer }
          - { package: ./emulator, target: FuzzLEDs }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/

  firmware:
    name: ESP32 emulator firmware
    # cmd/totememu only builds with TinyGo (build tag tinygo && esp32), so
    # the jobs above skip it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: 0.42.0
          install-binaryen: false

      - name: Build
        run: tinygo build -target esp32-generic -size short -o totememu.bin ./cmd/totememu

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
